<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>coding伴侣</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%0A%20%20%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2218%22%20fill%3D%22%23ff2e5f%22%2F%3E%0A%20%20%3Crect%20x%3D%2210%22%20y%3D%2213%22%20width%3D%2244%22%20height%3D%2238%22%20rx%3D%229%22%20fill%3D%22%231b1e26%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23aeb7c8%22%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2217%22%20cy%3D%2220%22%20r%3D%221.5%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2222%22%20cy%3D%2220%22%20r%3D%221.5%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2227%22%20cy%3D%2220%22%20r%3D%221.5%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3Cpath%20d%3D%22m23%2029-6%206%206%206m18-12%206%206-6%206%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M29%2029.5v11l8-5.5-8-5.5Z%22%20fill%3D%22%23ff527b%22%20stroke%3D%22%23ff527b%22%20stroke-width%3D%221.5%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E">
<script>
(() => {
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  const modes = ['system', 'light', 'dark'];
  let mode = 'system';
  try {
    const saved = localStorage.getItem('hg_theme');
    if (modes.includes(saved)) mode = saved;
  } catch (_) {}
  function apply() {
    const resolved = mode === 'system' ? (system.matches ? 'dark' : 'light') : mode;
    if (document.documentElement.dataset.theme !== resolved) document.documentElement.dataset.theme = resolved;
  }
  window.hgTheme = {
    mode: () => mode,
    set(value) {
      if (!modes.includes(value)) return;
      if (mode === value) return;
      mode = value;
      try { localStorage.setItem('hg_theme', mode); } catch (_) {}
      apply();
    },
  };
  const changed = () => { if (mode === 'system') apply(); };
  if (system.addEventListener) system.addEventListener('change', changed);
  else system.addListener(changed);
  apply();
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink: #ff2e5f;
    --pink-soft: #ffe9f0;
    --pink-border: #ffc9d8;
    --bg: #f5f6f8;
    --line: #eceef1;
    --txt: #1f2129;
    --txt2: #6b7080;
    --surface: #fff;
    --control: #f6f7f9;
    --search-bg: #f2f3f5;
    --txt-control: #333;
    --nav-txt: #5a5f6e;
    --muted: #9298a5;
    --intro: #4c5162;
    --scroll: #d6d8de;
    --skeleton-start: #e8e9ee;
    --skeleton-end: #d9dbe2;
    --seen: #a7acb9;
    --separator: #d8dae0;
    --track: #eef0f3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --pink: #ff527b;
    --pink-soft: #39202b;
    --pink-border: #773248;
    --bg: #111318;
    --surface: #1b1e26;
    --control: #272b35;
    --search-bg: #272b35;
    --line: #323744;
    --txt: #edf0f5;
    --txt2: #afb7c8;
    --txt-control: #e1e6ef;
    --nav-txt: #b3bccd;
    --muted: #a4aec0;
    --intro: #bdc5d4;
    --scroll: #4e5668;
    --skeleton-start: #303644;
    --skeleton-end: #242a36;
    --seen: #97a2b7;
    --separator: #566075;
    --track: #323744;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--txt); font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }

  /* ===== 侧边栏 ===== */
  .side {
    position: fixed; left: 0; top: 0; bottom: 0; width: 72px; z-index: 20;
    background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; padding: 16px 0 18px;
  }
  .logo {
    width: 36px; height: 36px; border-radius: 11px; margin-bottom: 22px;
    display: grid; place-items: center; cursor: pointer;
  }
  .logo svg { width: 36px; height: 36px; display: block; }
  .nav {
    width: 100%; padding: 11px 0; display: flex; flex-direction: column;
    align-items: center; gap: 4px; color: var(--nav-txt); cursor: pointer; font-size: 11px;
    user-select: none;
  }
  .nav svg { width: 22px; height: 22px; }
  .nav.on { color: var(--pink); font-weight: 600; }
  .nav:hover { color: var(--pink); }
  .side .spacer { flex: 1; }

  /* ===== 主区 ===== */
  .main { margin-left: 72px; min-height: 100vh; display: flex; flex-direction: column; }
  .top {
    position: sticky; top: 0; z-index: 10; background: var(--surface);
    display: flex; align-items: center; gap: 26px; height: 60px; padding: 0 26px;
  }
  .brand { font-size: 19px; font-weight: 800; color: var(--pink); letter-spacing: .5px; white-space: nowrap; }
  .gtabs { display: flex; gap: 24px; }
  .gtab { font-size: 15px; color: var(--txt-control); padding: 19px 2px 17px; cursor: pointer; border-bottom: 2.5px solid transparent; }
  .gtab.on { color: var(--pink); font-weight: 700; border-color: var(--pink); }
  .searchbox {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    background: var(--search-bg); border-radius: 10px; padding: 8px 14px; width: 300px;
  }
  .searchbox input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 13px; color: var(--txt); }
  .searchbox svg { width: 17px; height: 17px; color: #8a8f9c; cursor: pointer; }
  .theme-buttons {
    display: flex; flex: none; gap: 3px; padding: 3px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--control);
  }
  .theme-buttons button {
    min-height: 30px; padding: 5px 10px; border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--txt2); font: inherit; font-size: 12px;
    white-space: nowrap; cursor: pointer;
  }
  .theme-buttons button:hover { color: var(--pink); }
  .theme-buttons button[aria-pressed="true"] { color: var(--pink); background: var(--pink-soft); border-color: var(--pink-border); font-weight: 600; }
  .theme-buttons button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  .searchbox { min-width: 140px; width: clamp(140px, 24vw, 300px); }
  .searchbox input { min-width: 0; }
  .gtabs:empty { display: none; }
  @media (max-width: 900px) {
    .top { gap: 12px; padding: 0 16px; }
    .gtabs { gap: 14px; }
  }
  @media (max-width: 640px) {
    .top { flex-wrap: wrap; height: auto; min-height: 60px; padding: 10px 12px; gap: 8px 12px; }
    .brand { order: 1; }
    .theme-buttons { order: 2; margin-left: auto; }
    .searchbox { order: 3; width: 100%; margin-left: 0; }
    .gtabs { order: 4; width: 100%; }
    .gtab { padding: 8px 2px; }
  }

  .view { flex: 1; padding: 18px 26px 70px; max-width: 1460px; width: 100%; margin: 0 auto; }

  /* ===== 通用组件 ===== */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 22px; }
  .chip {
    padding: 5px 15px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
    font-size: 13px; color: var(--txt-control); cursor: pointer; transition: .12s;
  }
  .chip:hover { border-color: var(--pink-border); color: var(--pink); }
  .chip.on { background: var(--pink-soft); color: var(--pink); border-color: var(--pink-border); font-weight: 600; }

  .sechead { display: flex; align-items: center; margin: 26px 0 16px; }
  .sechead:first-child { margin-top: 2px; }
  .sechead h2 { font-size: 20px; font-weight: 800; }
  .sechead .sub { margin-left: 14px; display: flex; gap: 10px; }
  .sechead .acts { margin-left: auto; display: flex; gap: 10px; }
  .ghost {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; color: var(--txt-control); cursor: pointer;
  }
  .ghost:hover { border-color: var(--pink-border); color: var(--pink); }
  .pill-tab {
    padding: 5px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    font-size: 13px; cursor: pointer; color: var(--txt-control);
  }
  .pill-tab.on { color: var(--pink); border-color: var(--pink); background: var(--pink-soft); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 14px; }

  .card { cursor: pointer; }
  .poster {
    position: relative; aspect-ratio: 7/10; border-radius: 9px; overflow: hidden;
    background: linear-gradient(160deg, var(--skeleton-start), var(--skeleton-end));
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  .card:hover .poster img { transform: scale(1.04); }
  .rk {
    position: absolute; top: 5px; left: 9px; font-size: 20px; font-weight: 800; font-style: italic;
    color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.55); z-index: 2;
  }
  .rk.top3 { font-size: 26px; }
  .pill {
    position: absolute; z-index: 2; background: rgba(0,0,0,.55); color: #fff;
    font-size: 11px; padding: 2.5px 8px; border-radius: 999px; backdrop-filter: blur(2px);
  }
  .pill.heat { bottom: 7px; left: 7px; }
  .playov {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
    background: rgba(0,0,0,.12); opacity: 0; transition: .16s;
  }
  .card:hover .playov { opacity: 1; }
  .playov .cir {
    width: 46px; height: 46px; border-radius: 50%; background: var(--pink);
    display: grid; place-items: center; box-shadow: 0 4px 14px rgba(255,46,95,.45);
  }
  .crow { display: flex; align-items: flex-start; gap: 6px; margin-top: 9px; }
  .ctitle {
    flex: 1; font-size: 13px; font-weight: 500; line-height: 1.45; color: var(--txt);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .favbtn { border: 0; background: none; cursor: pointer; color: #b6bac4; padding: 2px; flex: none; }
  .favbtn.on { color: var(--pink); }
  .favbtn:hover { color: var(--pink); }
  .cmeta { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .ceps { flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ctags { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty { text-align: center; padding: 90px 0; color: var(--muted); }
  .empty .big { font-size: 44px; margin-bottom: 12px; }
  .loadbox { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 80px 0; color: var(--txt2); }
  .spin {
    width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--pink);
    border-radius: 50%; animation: rot 0.8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ===== 详情页 ===== */
  .hero { display: flex; gap: 26px; background: var(--surface); border-radius: 14px; padding: 24px; }
  .hero .hposter { width: 212px; flex: none; aspect-ratio: 7/10; border-radius: 10px; object-fit: cover; background: var(--skeleton-start); }
  .hinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .hinfo h1 { font-size: 23px; font-weight: 800; }
  .hmeta { display: flex; flex-wrap: wrap; gap: 7px 0; margin-top: 10px; font-size: 13px; color: var(--txt2); }
  .hmeta b { color: var(--pink); font-weight: 700; }
  .hmeta .sep { margin: 0 10px; color: var(--separator); }
  .hintro { margin-top: 14px; font-size: 13.5px; color: var(--intro); line-height: 1.75; }
  .intro-text.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hintro .more { color: var(--pink); cursor: pointer; white-space: nowrap;
    background: none; border: 0; padding: 0; margin-top: 4px; font: inherit; }
  .seasons { margin-top: 20px; }
  .seasons h3 { font-size: 14px; margin-bottom: 10px; }
  .season-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .season-btn { background: var(--control); border: 1px solid transparent; border-radius: 9px;
    padding: 9px 14px; font-size: 13px; color: var(--txt); cursor: pointer; }
  .season-btn:hover { border-color: var(--pink-border); }
  .season-btn.on { background: var(--pink-soft); color: var(--pink); border-color: var(--pink-border); font-weight: 600; }
  .season-note { color: var(--txt2); font-size: 12px; line-height: 1.7; }
  .season-retry { background: none; border: 0; color: var(--pink); cursor: pointer; padding: 0 6px; font-size: 12px; }
  .hbtns { margin-top: auto; padding-top: 18px; display: flex; gap: 12px; }
  .btn-pink {
    display: inline-flex; align-items: center; gap: 7px; background: var(--pink); color: #fff;
    border: 0; border-radius: 10px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-pink:hover { filter: brightness(1.06); }
  .btn-line {
    display: inline-flex; align-items: center; gap: 7px; background: var(--surface); color: var(--txt-control);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; font-size: 14px; cursor: pointer;
  }
  .btn-line.on { color: var(--pink); border-color: var(--pink-border); background: var(--pink-soft); }

  .epswrap { background: var(--surface); border-radius: 14px; padding: 20px 24px 24px; margin-top: 16px; }
  .epswrap h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
  .ep {
    height: 38px; border-radius: 9px; background: var(--control); border: 1px solid transparent;
    display: grid; place-items: center; font-size: 13px; cursor: pointer; color: var(--txt-control);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px;
  }
  .ep:hover { border-color: var(--pink-border); color: var(--pink); }
  .ep.seen { color: var(--seen); }
  .ep.cur { background: var(--pink-soft); color: var(--pink); border-color: var(--pink-border); font-weight: 700; }

  /* ===== 播放页 ===== */
  body.watching { overflow: hidden; }
  body.watching .main { height: 100vh; height: 100dvh; min-height: 0; }
  body.watching .top { flex-shrink: 0; gap: clamp(8px, 1.2vw, 18px); }
  body.watching .view { padding: 0; max-width: none; min-height: 0; overflow: hidden; }
  .watch { display: flex; height: 100%; background: #000; }
  .stage { flex: 1; position: relative; display: flex; min-width: 0; min-height: 0; }
  .stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .watch-toggle { display: none; white-space: nowrap; }
  body.watching .watch-toggle { display: inline-block; }
  .watch-back { display: none; flex: none; align-items: center; gap: 5px; min-height: 36px; text-decoration: none; white-space: nowrap; }
  body.watching .watch-back { display: inline-flex; }
  .watch-episode { display: none; flex: 1; min-width: 0; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  body.watching .brand { display: none; }
  body.watching .watch-episode { display: flex; }
  .watch-series { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--txt); }
  .watch-position { flex: none; white-space: nowrap; color: var(--pink); }
  .vload {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; color: #fff; background: rgba(0,0,0,.5); z-index: 6;
  }
  .vload .tip { font-size: 13px; color: #d8dae0; }
  .watch-heading { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; }
  .watch-heading .back { flex: none; padding: 4px; background: none; border: 0; color: var(--txt); cursor: pointer; }
  .watch-heading .wt { min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .watch-actions { display: flex; align-items: center; gap: 8px; padding: 8px 16px; }
  .watch-actions button { padding: 7px 10px; font-size: 12px; }
  .autoc { color: var(--txt); background: var(--control); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .autoc.on { color: var(--pink); background: var(--pink-soft); border-color: var(--pink-border); }
  @media (max-width: 640px) {
    .watch-episode { order: 1; flex: 1 1 100%; }
    .watch-toggle { order: 2; }
    .watch .epdrawer { width: 220px; max-width: 55%; }
    .watch-actions { flex-wrap: wrap; }
  }
  .epdrawer {
    width: 292px; flex: none; background: var(--surface); display: flex; flex-direction: column;
    border-left: 1px solid var(--line);
  }
  .epdrawer.hidden { display: none; }
  .epdrawer .dh { padding: 14px 16px 10px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--line); }
  .epdrawer .dlist { flex: 1; overflow-y: auto; padding: 8px; }
  .ditem { display: flex; gap: 8px; padding: 8px; border-radius: 9px; cursor: pointer; align-items: center; }
  .ditem:hover { background: var(--control); }
  .ditem.cur { background: var(--pink-soft); }
  .ditem .no { min-width: 64px; white-space: nowrap; color: var(--muted); font-size: 13px; flex: none; }
  .ditem.cur .no { color: var(--pink); font-weight: 700; }
  .ditem .dt { flex: 1; font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
  /* ===== 历史/收藏列表 ===== */
  .hrow {
    display: flex; gap: 14px; background: var(--surface); border-radius: 12px; padding: 12px; margin-bottom: 12px;
    align-items: center; cursor: pointer;
  }
  .hrow:hover { box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .hthumb { width: 86px; aspect-ratio: 7/10; border-radius: 8px; object-fit: cover; flex: none; background: var(--skeleton-start); }
  .hinfo2 { flex: 1; min-width: 0; }
  .hinfo2 .t { font-size: 15px; font-weight: 600; }
  .hinfo2 .m { font-size: 12.5px; color: var(--txt2); margin-top: 5px; }
  .hbar { margin-top: 9px; height: 4px; background: var(--track); border-radius: 2px; max-width: 320px; }
  .hbar i { display: block; height: 100%; background: var(--pink); border-radius: 2px; }
  .hacts { display: flex; gap: 8px; flex: none; }

  /* ===== 设置 ===== */
  html.coding-tv .settings-password-action { display: none; }
  .setbox { background: var(--surface); border-radius: 14px; padding: 22px 26px; margin-bottom: 16px; }
  .setbox h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
  .settings-subtitle { color: var(--txt); font-size: 13.5px; line-height: 1.5; font-weight: 700; margin: 20px 0 8px; padding-top: 18px; border-top: 1px solid var(--line); }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; font-size: 13.5px; }
  .kv .k { color: var(--txt2); }
  .setbox .kv { align-items: center; gap: 12px; flex-wrap: wrap; }
  .setbox select {
    min-width: 140px; max-width: 100%; height: 40px; padding: 0 12px;
    font: inherit; font-size: 14px; color: var(--txt); background: var(--control);
    border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  }
  .setbox #cache-mode { width: 300px; }
  .setbox select:disabled { opacity: .55; cursor: default; }
  .setbox input[type="checkbox"] { width: 22px; height: 22px; margin: 0; accent-color: var(--pink); cursor: pointer; }
  .oktag { color: #0aa870; font-weight: 600; }
  .note { font-size: 12.5px; color: var(--muted); line-height: 1.8; }

  #toast {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(20px);
    background: rgba(25,27,34,.92); color: #fff; padding: 10px 22px; border-radius: 10px;
    font-size: 13.5px; opacity: 0; transition: .25s; z-index: 99; pointer-events: none; max-width: 70vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .search-submit { border: 0; background: transparent; padding: 0; display: grid; place-items: center; cursor: pointer; }
  .card, .ctitle, .cmeta { min-width: 0; }
  @media (min-width: 768px) and (max-width: 1100px) {
    body:not(.watching) .top { height: auto; min-height: 60px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
    body:not(.watching) .gtabs { order: 4; width: 100%; }
    body:not(.watching) .gtab { padding: 8px 2px; }
    body.watching .searchbox { display: none; }
  }
  /* 手机使用底部导航，播放与选集上下排列。 */
  @media (max-width: 767px) {

<script>
'use strict';
/* ================= 基础 ================= */
const $ = s => document.querySelector(s);
const themeButtons = document.querySelectorAll('[data-theme-mode]');
function syncThemeButtons() {
  themeButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeMode === window.hgTheme.mode())));
}
themeButtons.forEach(button => button.addEventListener('click', () => {
  window.hgTheme.set(button.dataset.themeMode);
  syncThemeButtons();
}));
syncThemeButtons();
const GENRES = [
  { id: 'short_play', name: '真人剧' },
  { id: 'comic_series', name: '漫剧' },
  { id: 'ai_series', name: 'AI剧' },
];
const PINK = '#ff2e5f';
let curGenre = localStorage.getItem('hg_genre') || 'comic_series';
function originalCover(value) {
  let cover = String(value || '');
  for (let i = 0; i < 8; i++) {
    try {
      const url = new URL(cover, location.origin);
      if (url.origin !== location.origin || url.pathname !== '/img') break;
      const next = url.searchParams.get('url');
      if (!next || next === cover) break;
      cover = next;
    } catch (_) { break; }
  }
  return cover;
}
const imgx = (u, width = 320) => '/img?w=' + width + '&url=' + encodeURIComponent(originalCover(u));
const fmtW = n => !n ? '' : n >= 1e8 ? (n / 1e8).toFixed(1) + '亿' : n >= 1e4 ? Math.round(n / 1e4) + '万' : String(n);
const fmtT = s => { s = Math.max(0, Math.floor(s||0)); const m = Math.floor(s/60); return m + ':' + String(s%60).padStart(2,'0'); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// category 字段不同接口类型不一: browse 是 "a / b / c" 字符串, episodes 是数组 → 统一转"·"分隔展示
const catStr = v => typeof v === 'string' ? v : Array.isArray(v) ? v.filter(x => typeof x === 'string').join('/') : '';
const catDots = (v, n=3) => catStr(v).split('/').map(s => s.trim()).filter(Boolean).slice(0, n).join(' · ');

let siteLoginPending = false;
function requireSiteLogin() {
  if (siteLoginPending) return;
  siteLoginPending = true;
  W.stop?.();
  location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search + location.hash));
}
const siteFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const response = await siteFetch(...args);
  const requestURL = args[0] instanceof Request ? args[0].url : String(args[0]);
  if (response.status === 401 && new URL(requestURL, location.href).origin === location.origin) requireSiteLogin();
  return response;
};
window.addEventListener('pageshow', event => {
  if (event.persisted) fetch('/playback/settings', {cache:'no-store'}).catch(() => {});
});

async function api(path, {revalidate = false, signal, headers} = {}) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 30000), cancel = () => ctl.abort(); if (signal) { signal.addEventListener('abort', cancel, {once:true}); if (signal.aborted) cancel(); }
  try {
    const r = await fetch(path, { signal: ctl.signal, headers, cache: revalidate ? 'no-cache' : 'default' });
    if (!r.ok) { let d = ''; try { d = (await r.json()).detail || ''; } catch(e){} const error = new Error(d || ('HTTP ' + r.status)); error.status = r.status; throw error; }
    const data = await r.json();
    if (data && typeof data === 'object') Object.defineProperty(data, '_nasStale', {value: r.headers.get('X-NAS-Cache') === 'STALE'});
    return data;
  } finally { clearTimeout(t); if (signal) signal.removeEventListener('abort', cancel); }
}
// 全局兜底: 未捕获的异步错误显示在页面上(避免静默卡在加载态)
window.addEventListener('unhandledrejection', ev => {
  const e = ev.reason || {};
  const el = $('#view');
  if (el) el.innerHTML = `<div class="empty"><div class="big">⚠️</div>${esc(e.message || String(e))}
    <br><br><button class="ghost" onclick="location.reload()">重新加载</button></div>`;
});
function toast(msg, ms=2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms);
}
function go(hash) {
  if (location.hash === hash) route();
  else { history.pushState({codingRoute: true}, '', hash); route(); }
}
function doSearch() {
  const v = $('#q').value.trim();
  if (v) go('#/search/' + encodeURIComponent(v));
}

/* ================= 收藏 / 历史 ================= */
const {favs, hist} = CodingWatchState;
CodingWatchState.start();
const cache = { filters: {}, eps: {} };

/* ================= 卡片 ================= */
function cardHTML(it, opt = {}) {
  const cat = catDots(it.category);
  const isFav = favs.has(it.series_id);
  const heat = it.hot || (it.play_cnt ? fmtW(it.play_cnt) + '热度' : '');
  return `
  <div class="card" data-sid="${it.series_id}" onclick="go('#/detail/${it.series_id}')">
    <div class="poster">${location.hash === '#/fav' ? CodingWatchUI.badge(it.series_id) : ''}
      ${opt.rank ? `<div class="rk ${opt.rank<=3?'top3':''}">${opt.rank}</div>` : ''}
      ${heat ? `<div class="pill heat">${esc(heat)}</div>` : ''}
      <img loading="lazy" src="${imgx(it.cover)}" onerror="this.style.visibility='hidden'">
      <div class="playov"><div class="cir">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10.2-6.5c.6-.4.6-1.4 0-1.8L9.6 4.6c-.7-.4-1.6.1-1.6.9z"/></svg>
      </div></div>
    </div>
    <div class="crow">
      <div class="ctitle">${esc(it.title)}</div>
      <button class="favbtn ${isFav?'on':''}" title="${isFav?'取消收藏':'收藏'}" aria-label="${isFav?'取消收藏':'收藏'}" aria-pressed="${isFav}" onclick="event.stopPropagation();toggleFav('${it.series_id}',this)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav?PINK:'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 4h12v17l-6-4.2L6 21V4z"/></svg>
      </button>
    </div>
    <div class="cmeta"><div class="ctags">${esc(cat || (it.score ? '评分 ' + it.score : ''))}</div>
      ${it.episode_cnt ? `<span class="ceps">全 ${esc(it.episode_cnt)} 集</span>` : ''}</div>
  </div>`;
}
function toggleFav(sid, btn) {
  if (location.hash === '#/fav') {
    favs.remove(sid);
    vFav();
    toast('已取消收藏');
    return;
  }
  const on = favs.toggle({ sid, title: btn.closest('.card').querySelector('.ctitle').textContent,
                           cover: btn.closest('.card').querySelector('img')?.src || '', ts: 0 });
  btn.classList.toggle('on', on);
  btn.querySelector('svg').setAttribute('fill', on ? PINK : 'none');
  btn.title = on ? '取消收藏' : '收藏';
  btn.setAttribute('aria-label', btn.title);
  btn.setAttribute('aria-pressed', String(on));
  toast(on ? '已加入收藏' : '已取消收藏');
}
function gridHTML(items, opt = {}) {
  if (!items || !items.length) return `<div class="empty"><div class="big">🎬</div>暂无内容</div>`;
  return `<div class="grid">${items.map((it, i) => cardHTML(it, { ...opt, rank: opt.ranked ? i + 1 : null })).join('')}</div>`;

let introObserver = null;
function setupIntroToggle(text, button) {
  introObserver?.disconnect();
  let expanded = false, width = -1;
  const render = () => {
    text.classList.toggle('clamp', !expanded);
    button.textContent = expanded ? '收起' : '展开';
    button.setAttribute('aria-expanded', String(expanded));
  };
  const measure = () => {
    if (width === text.clientWidth) return;
    width = text.clientWidth;
    text.classList.add('clamp');
    const clipped = text.scrollHeight > text.clientHeight + 1;
    if (!clipped) expanded = false;
    button.hidden = !clipped;
    render();
  };
  button.onclick = () => { expanded = !expanded; render(); };
  measure();
  if (window.ResizeObserver) {
    introObserver = new window.ResizeObserver(measure);
    introObserver.observe(text);
  }
}

const W = { sid: null, eps: [], meta: null, ep: 1, auto: true, speed: 1, saveT: null };
async function vWatch(sid, ep, resumeAt) {
  renderGtabs(true);

      cache.eps[sid] = eps; (cache.meta = cache.meta || {})[sid] = meta;
    }

  }

  W.sid = sid; W.eps = eps; W.ep = Math.min(Math.max(1, ep|0), eps.length);
  W.resumeAt = resumeAt;

  <div class="watch">
    <div class="stage" id="stage">
      <video id="video" controls playsinline></video>
      <div class="vload" id="vload"><div class="spin" style="border-color:rgba(255,255,255,.3);border-top-color:${PINK}"></div>
        <div class="tip" id="vtip">正在准备第${W.ep}集</div>
        <button class="ghost" id="vstart" style="display:none;color:#fff" onclick="W.play()">开始播放</button>
        <button class="ghost" id="vretry" style="display:none;color:#fff" onclick="W.load(W.ep, false, true)">重试本集</button></div>
    </div>
    <div class="epdrawer" id="drawer">
      <div class="watch-heading">
        <button class="back" onclick="go('#/detail/${sid}')" aria-label="返回剧集详情">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="wt" id="wtitle"></div>
      </div>
      <div class="watch-actions">
        <button class="ghost" onclick="W.step(-1)">上一集</button>
        <button class="ghost" onclick="W.step(1)">下一集</button>
        <button class="autoc ${W.auto?'on':''}" id="autoc" onclick="W.toggleAuto()" aria-pressed="${W.auto}">自动连播</button>
      </div>
      <div class="dh">选集（${eps.length}）</div><div class="note" id="cache-progress" style="padding:0 18px 12px">正在连接缓存队列…</div>
      <div class="dlist">
        ${eps.map(e => `<div class="ditem ${e.index===W.ep?'cur':''}" data-ep="${e.index}" onclick="W.load(${e.index})">
          <span class="no">第${e.index}集</span><span class="dt">未缓存</span></div>`).join('')}
      </div>
    </div>
  </div>`;
  W.bind();
  W.load(W.ep, true);
}

W.bind = () => {

  W.mediaReady = false;
  W.metadataReady = false;
  W.finished = false;
  W.play = () => { if (v.paused) v.play().catch(() => toast('播放未能开始，请重试本集')); else v.pause(); };
  W.toggleDrawer = () => {
    const hidden = $('#drawer').classList.toggle('hidden');
    $('.watch').classList.toggle('drawer-hidden', hidden);
    $('#watch-toggle').textContent = hidden ? '展开选集' : '收起选集';
    $('#watch-toggle').setAttribute('aria-expanded', String(!hidden));
  };
  $('#watch-toggle').textContent = '收起选集';
  $('#watch-toggle').setAttribute('aria-expanded', 'true');

    W.auto = !W.auto; $('#autoc').classList.toggle('on', W.auto);
    $('#autoc').setAttribute('aria-pressed', String(W.auto));
    toast(W.auto ? '自动连播已开启' : '自动连播已关闭', 1200);
  };
  W.step = d => { const n = W.ep + d; if (n >= 1 && n <= W.eps.length) W.load(n); };

    document.querySelectorAll('.ditem').forEach(item => {

    }

    const prepare = async () => update(await post('/playback/prepare', body), n, token);

  };
  W.load = (n, first = false, retry = false, automatic = false) => {
    if (n < 1 || n > W.eps.length) return;
    if (n === W.ep && !first && !automatic) retry = true;
    if (!W.alive) { go(`#/watch/${W.sid}/${n}`); return; }
    W.save();
    const rec = hist.get(W.sid);
    W.resumePos = first && W.resumeAt !== undefined ? Math.max(0, Number(W.resumeAt) || 0) :
      (first || retry) && rec && Number(rec.ep) === n && !rec.finished ? Math.max(0, Number(rec.pos) || 0) : 0;
    W.mediaReady = false; W.metadataReady = false; W.finished = false; W.saveT = null;
    if (!automatic && !retry) W.completed = 0;
    if (!retry) mediaRetry = 0;
    v.pause(); v.removeAttribute('src'); v.load();
    W.ep = n; W.activeEp = 0; W.token++; pollFailures = 0; pollFailureAt = 0;
    W.statusPoll?.select();
    $('#vload').style.display = 'flex';
    $('#vload .spin').style.display = '';
    $('#vretry').style.display = 'none';
    $('#vstart').style.display = 'none';
    $('#vtip').textContent = `正在连接队列，准备第${n}集…`;
    $('#wtitle').textContent = `${W.title ? W.title + ' · ' : ''}第${n}集`;

    const token = W.token;

  };

    update: (data, snapshot) => { update(data, snapshot.n, snapshot.token); if (snapshot.token === W.token) { pollFailures = 0; pollFailureAt = 0; } },

};
W.save = finished => {
  const v = W.video;
  if (!v || !W.sid || !W.alive || !W.mediaReady || W.activeEp !== W.ep || v.seeking || W.finished) return;
  const dur = v.duration || 0, pos = v.currentTime || 0;
  if (!Number.isFinite(dur) || dur <= 0 || !Number.isFinite(pos)) return;
  hist.put({ sid: W.sid, title: W.title || '', cover: W.cover || '',
             ep: W.ep, epCnt: W.eps.length, pos: Math.min(pos, dur), dur, finished: !!finished });
  if (finished) W.finished = true;
};
W.release = () => { W.stop?.(); for (const key of ['video','device','play','toggleDrawer','toggleAuto','step','prepare','load','stop','unload','visibility']) delete W[key]; };
/* ================= 视图: 收藏 ================= */
async function vFav() {
  renderGtabs(true); await CodingWatchState.ready(); if (location.hash !== '#/fav') return;
  const a = favs.all(); CodingWatchUI.checkUpdates();
  $('#view').innerHTML = `
    <div class="sechead"><h2>收藏</h2><div class="sub"><span class="note" style="align-self:center">${a.length} 部</span></div></div>
    ${a.length ? gridHTML(a.map(x => ({ ...x, series_id: x.sid, category: x.cat || '' }))) :
      '<div class="empty"><div class="big">📚</div>还没有收藏，去发现页标记喜欢的剧吧</div>'}`;
}

/* ================= 视图: 历史 ================= */
async function vHistory() {
  renderGtabs(true); await CodingWatchState.ready(); if (location.hash !== '#/history') return;
  const a = hist.all();
  $('#view').innerHTML = `
    <div class="sechead"><h2>观看历史</h2>
      <div class="acts">${a.length ? '<button class="ghost" onclick="clearHist()">清空列表</button>' : ''}</div>
    </div>
    <div id="hbox">
    ${a.length ? a.map(x => `
      <div class="hrow" onclick="go('#/watch/${x.sid}/${x.ep}')">
        <img class="hthumb" src="${imgx(x.cover)}" onerror="this.style.visibility='hidden'">
        <div class="hinfo2">
          <div class="t">${esc(x.title || '未知剧名')}</div>
          <div class="m">${x.finished ? '已看完' : '看到'} 第${x.ep}集${x.epCnt ? ' / 共' + x.epCnt + '集' : ''} · ${fmtT(x.pos)}${x.dur ? ' / ' + fmtT(x.dur) : ''} · ${new Date(x.ts).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
          <div class="hbar"><i style="width:${Math.min(100, (x.pos||0)/(x.dur||1)*100).toFixed(1)}%"></i></div>
        </div>
        <div class="hacts">
          <button class="ghost" onclick="event.stopPropagation();go('#/watch/${x.sid}/${x.ep}')">${x.finished ? '重新播放' : '从 ' + fmtT(x.pos) + ' 继续'}</button>
          <button class="ghost" onclick="event.stopPropagation();delHist('${x.sid}')">删除</button>
        </div>
      </div>`).join('') : '<div class="empty"><div class="big">🕐</div>暂无观看记录</div>'}
    </div>`;
}
function delHist(sid) { hist.remove(sid); vHistory(); toast('已删除该记录'); }
function clearHist() {
  if (!confirm('确定清空全部观看历史？收藏不受影响。')) return;
  hist.clear(); vHistory(); toast('已清空观看历史');
}

async function changeSitePassword(event) {
  event.preventDefault();
  const message = $('#site-password-result'), button = $('#site-password-save');
  const newPassword = $('#site-new').value;
  if (newPassword !== $('#site-confirm').value) { message.textContent = '两次输入的新密码不一致'; return; }
  button.disabled = true; message.textContent = '正在修改…';
  try {
    const response = await fetch('/auth/password', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({current_password:$('#site-current').value, new_password:newPassword})});
    const data = await response.json();
    if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : '修改失败，请重试');
    requireSiteLogin();
  } catch (error) { message.textContent = error.message || '修改失败，请重试'; }
  finally { button.disabled = false; }
}
async function logoutSite() {
  W.stop?.();
  try {
    const response = await fetch('/auth/logout', {method:'POST'});
    if (!response.ok) throw new Error('退出失败');
    requireSiteLogin();
  } catch (_) { toast('退出失败，请重试'); }
}

/* ================= 头部 tabs ================= */
function renderGtabs(hide) {
  const box = $('#gtabs');
  if (hide) { box.innerHTML = ''; return; }
  box.innerHTML = GENRES.map(g =>
    `<div class="gtab ${g.id === curGenre ? 'on' : ''}" data-g="${g.id}" onclick="switchGenre('${g.id}')">${g.name}</div>`).join('');
}
function switchGenre(g) {
  curGenre = g; localStorage.setItem('hg_genre', g);
  if (location.hash.startsWith('#/discover') || location.hash === '' || location.hash === '#') route();
  else go('#/discover');
}

/* ================= 路由 ================= */
function route() {
  routedLocation = location.href;
  discoverVersion++; CodingLibrary.stop();
  CodingSettings.stop(); CodingPageRequests.stop();
  CodingSearch.stop();
  W.release();
  introObserver?.disconnect();
  introObserver = null;
  document.title = 'coding伴侣';
  const h = location.hash.replace(/^#\/?/, '');
  const [view, ...rest] = h.split('/');
  document.body.classList.toggle('watching', view === 'watch' && !!rest[0]);
  $('#watch-series').textContent = view === 'watch' && rest[0] ? '正在读取剧集…' : '';
  $('#watch-position').textContent = '';
  if (view === 'watch' && rest[0]) $('#watch-back').href = '#/detail/' + encodeURIComponent(rest[0]);
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.nav === view));
  window.scrollTo(0, 0);
  if (view === 'detail' && rest[0]) vDetail(rest[0]);
  else if (view === 'watch' && rest[0]) vWatch(rest[0], parseInt(rest[1] || '1', 10), rest[2] === undefined ? undefined : Number(rest[2]));
  else if (view === 'search') vSearch(decodeURIComponent(rest.join('/') || ''));
  else if (view === 'rank') vRank();
  else if (view === 'fav') vFav();
  else if (view === 'history') vHistory();
  else if (view === 'settings') vSettings();
  else vDiscover();
}
let routedLocation = '';
function routeFromHistory() { if (routedLocation !== location.href) route(); }
window.addEventListener('popstate', routeFromHistory);
window.addEventListener('hashchange', routeFromHistory);
route();
</script>
